# CAP Protocol Elements Value Set - Invasive Carcinoma of the Breast
# Aligned with CAP Cancer Protocols & WHO 6th Edition

specimen_types:
  - id: core_biopsy
    name: Core Needle Biopsy
    protocol: biopsy
  - id: excision
    name: Excision / Partial Mastectomy (Lumpectomy)
    protocol: resection
  - id: re_excision
    name: Re-excision
    protocol: resection
  - id: total_mastectomy
    name: Total Mastectomy (Simple Mastectomy)
    protocol: resection
  - id: modified_radical_mastectomy
    name: Modified Radical Mastectomy
    protocol: resection
  - id: other
    name: Other Specimen Type
    protocol: resection

laterality_options:
  - id: right
    name: Right Breast
  - id: left
    name: Left Breast
  - id: bilateral
    name: Bilateral

tumor_sites:
  - id: upper_outer_quadrant
    name: Upper Outer Quadrant (UOQ)
  - id: upper_inner_quadrant
    name: Upper Inner Quadrant (UIQ)
  - id: lower_outer_quadrant
    name: Lower Outer Quadrant (LOQ)
  - id: lower_inner_quadrant
    name: Lower Inner Quadrant (LIQ)
  - id: central_subareolar
    name: Central / Subareolar
  - id: nipple
    name: Nipple
  - id: clock_12
    name: 12:00 Position
  - id: clock_1
    name: 1:00 Position
  - id: clock_2
    name: 2:00 Position
  - id: clock_3
    name: 3:00 Position
  - id: clock_4
    name: 4:00 Position
  - id: clock_5
    name: 5:00 Position
  - id: clock_6
    name: 6:00 Position
  - id: clock_7
    name: 7:00 Position
  - id: clock_8
    name: 8:00 Position
  - id: clock_9
    name: 9:00 Position
  - id: clock_10
    name: 10:00 Position
  - id: clock_11
    name: 11:00 Position

histologic_types:
  - id: IDC-NST
    name: Invasive Breast Carcinoma of No Special Type (Infiltrating Ductal)
  - id: ILC
    name: Invasive Lobular Carcinoma
  - id: mucinous
    name: Mucinous Carcinoma
  - id: tubular
    name: Tubular Carcinoma
  - id: papillary
    name: Invasive Papillary Carcinoma
  - id: micropapillary
    name: Invasive Micropapillary Carcinoma
  - id: metaplastic
    name: Metaplastic Carcinoma
  - id: apocrine
    name: Carcinoma with Apocrine Differentiation
  - id: medullary_features
    name: Invasive Carcinoma with Medullary Features
  - id: other
    name: Other / Special Type

grade_descriptions:
  1: Well differentiated (Score 3-5)
  2: Moderately differentiated (Score 6-7)
  3: Poorly differentiated (Score 8-9)

lvi_statuses:
  - id: absent
    name: Not Identified / Absent
  - id: present
    name: Present
  - id: indeterminate
    name: Cannot be determined / Indeterminate

margin_statuses:
  - id: negative
    name: Negative for invasive carcinoma (all margins clear)
  - id: positive
    name: Positive for invasive carcinoma (tumor extends to inked margin)
  - id: cannot_be_assessed
    name: Cannot be assessed

biomarker_defaults:
  er:
    status: "positive"
    percent: 95
    allred_score: 8
  pr:
    status: "positive"
    percent: 80
    allred_score: 7
  her2:
    ihc_score: "1+"
    fish_status: "not_performed"
    result: "negative"
  ki67:
    percent: 18

ajcc_staging_edition: "8th/9th Edition"
